<!-- let the page scroll if the window grows taller than the viewport -->
<body style="margin:0; overflow:auto;">

              border:2px solid #ff0095;
              background:#fff;          /* optional – keeps it clean under the iframes  */
              padding:0;
              box-sizing:border-box;">

    <!-- (title bar markup goes here, if you use one) -->

    <!-- PANORAMA 1 -------------------------------------------------------- -->
    <div style="position:relative; width:100%; padding-top:56.25%;  /* 16:9 box  */">

               width:100%; height:100%; border:none;">
      </iframe>
    </div>

    <!-- PANORAMA 2 -------------------------------------------------------- -->
